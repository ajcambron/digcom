<div class="gs-edittext">
  <style>
    .gs-edittext {
      --gs-bg: #ffffff;
      --gs-border: #dadce0;
      --gs-text-muted: #5f6368;
      --gs-accent: #1a73e8;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 500px;
      margin: 1em 0 1.5em 0;
    }
    .gs-edittext-toolbar {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 6px;
      background: var(--gs-bg);
      border: 1px solid var(--gs-border);
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
    }
    .gs-edittext-btn {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--gs-text-muted);
    }
    .gs-edittext-btn.active {
      background: #e8f0fe;
      color: var(--gs-accent);
    }
    .gs-edittext-sep {
      width: 1px;
      height: 20px;
      background: var(--gs-border);
      margin: 0 3px;
    }
    .gs-edittext-box {
      margin-top: 10px;
      padding: 12px;
      border: 1.5px dashed var(--gs-accent);
      border-radius: 4px;
      color: var(--gs-text-muted);
      font-size: 12px;
      max-width: 260px;
    }
  </style>

  <div class="gs-edittext-toolbar">
    <span class="gs-edittext-btn">&#10021;</span>
    <span class="gs-edittext-sep"></span>
    <span class="gs-edittext-btn active">&#9998;</span>
    <span class="gs-edittext-btn">&#8942;</span>
    <span class="gs-edittext-sep"></span>
    <span class="gs-edittext-btn">&#128465;</span>
  </div>
  <div class="gs-edittext-box">Selected text box</div>
</div>
