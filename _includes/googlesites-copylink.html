<div class="gs-copylink">
  <style>
    .gs-copylink {
      --gs-bg: #ffffff;
      --gs-panel: #f8f9fa;
      --gs-border: #dadce0;
      --gs-text: #202124;
      --gs-text-muted: #5f6368;
      --gs-accent: #1a73e8;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 320px;
      margin: 1em 0 1.5em 0;
    }
    .gs-copylink-anchor {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .gs-copylink-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e8f0fe;
      color: var(--gs-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .gs-copylink-caret {
      color: var(--gs-text-muted);
      font-size: 10px;
    }
    .gs-copylink-card {
      border-radius: 8px;
      background: var(--gs-bg);
      border: 1px solid var(--gs-border);
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
      padding: 12px;
      font-size: 12px;
    }
    .gs-copylink-title {
      font-weight: 500;
      margin-bottom: 8px;
    }
    .gs-copylink-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gs-copylink-field {
      flex: 1;
      background: var(--gs-panel);
      border: 1px solid var(--gs-border);
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--gs-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gs-copylink-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 4px;
      background: var(--gs-accent);
      color: #fff;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>

  <div class="gs-copylink-anchor">
    <span class="gs-copylink-icon">&#128279;</span>
    <span class="gs-copylink-caret">&#9650;</span>
  </div>
  <div class="gs-copylink-card">
    <div class="gs-copylink-title">Copy published site link</div>
    <div class="gs-copylink-row">
      <span class="gs-copylink-field">sites.google.com/view/{{ include.site_name | default: "your-site-name" }}</span>
      <span class="gs-copylink-btn"><span>&#128203;</span><span>Copy link</span></span>
    </div>
  </div>
</div>
