<div class="gs-publish">
  <style>
    .gs-publish {
      --gs-bg: #ffffff;
      --gs-panel: #f8f9fa;
      --gs-border: #dadce0;
      --gs-text: #202124;
      --gs-text-muted: #5f6368;
      --gs-purple: #8430ce;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 360px;
      margin: 1em 0 1.5em 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
      background: var(--gs-bg);
      color: var(--gs-text);
      font-size: 12.5px;
    }
    .gs-publish-header {
      padding: 14px 16px 4px 16px;
      font-size: 15px;
      font-weight: 500;
    }
    .gs-publish-sub {
      padding: 0 16px 12px 16px;
      color: var(--gs-text-muted);
      font-size: 11.5px;
    }
    .gs-publish-body {
      padding: 0 16px 14px 16px;
    }
    .gs-publish-label {
      display: block;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gs-text-muted);
      margin: 0 0 6px 0;
    }
    .gs-publish-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--gs-panel);
      border: 1px solid var(--gs-border);
      border-radius: 4px;
      padding: 7px 10px;
      color: var(--gs-text-muted);
    }
    .gs-publish-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--gs-border);
    }
    .gs-publish-btn {
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--gs-text-muted);
    }
    .gs-publish-btn.primary {
      background: var(--gs-purple);
      color: #fff;
      font-weight: 500;
    }
  </style>

  <div class="gs-publish-header">Publish to the web</div>
  <div class="gs-publish-sub">Anyone with this link will be able to see your changes.</div>
  <div class="gs-publish-body">
    <span class="gs-publish-label">Site address</span>
    <div class="gs-publish-field"><span>&#128279;</span><span>sites.google.com/view/{{ include.site_name | default: "your-site-name" }}</span></div>
  </div>
  <div class="gs-publish-footer">
    <span class="gs-publish-btn">Cancel</span>
    <span class="gs-publish-btn primary">Publish</span>
  </div>
</div>
