<div class="gs-create">
  <style>
    .gs-create {
      --gs-bg: #ffffff;
      --gs-panel: #f8f9fa;
      --gs-border: #dadce0;
      --gs-text: #202124;
      --gs-text-muted: #5f6368;
      --gs-accent: #1a73e8;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 600px;
      margin: 1em 0 1.5em 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
      background: var(--gs-bg);
      color: var(--gs-text);
      font-size: 13px;
    }
    .gs-create-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--gs-border);
    }
    .gs-create-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
      color: var(--gs-text-muted);
    }
    .gs-create-logo .gs-swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: linear-gradient(135deg, #4285f4, #34a853 50%, #fbbc04 75%, #ea4335);
    }
    .gs-create-body {
      padding: 16px;
    }
    .gs-create-label {
      font-size: 13px;
      color: var(--gs-text-muted);
      margin: 0 0 10px 0;
    }
    .gs-template-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .gs-template-card {
      border: 2px solid transparent;
      border-radius: 6px;
      text-align: center;
      cursor: default;
    }
    .gs-template-thumb {
      aspect-ratio: 4 / 3;
      border: 1px solid var(--gs-border);
      border-radius: 6px;
      background: var(--gs-panel);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gs-template-card.selected .gs-template-thumb {
      border-color: var(--gs-accent);
      border-width: 2px;
      background: #e8f0fe;
    }
    .gs-template-plus {
      font-size: 24px;
      color: var(--gs-accent);
      font-weight: 300;
    }
    .gs-template-name {
      font-size: 11.5px;
      color: var(--gs-text);
      margin-top: 6px;
    }
  </style>

  <div class="gs-create-bar">
    <div class="gs-create-logo"><span class="gs-swatch"></span> Sites</div>
  </div>
  <div class="gs-create-body">
    <p class="gs-create-label">Start a new site</p>
    <div class="gs-template-row">
      <div class="gs-template-card selected">
        <div class="gs-template-thumb"><span class="gs-template-plus">&#43;</span></div>
        <div class="gs-template-name">Blank</div>
      </div>
      <div class="gs-template-card">
        <div class="gs-template-thumb"></div>
        <div class="gs-template-name">Portfolio</div>
      </div>
      <div class="gs-template-card">
        <div class="gs-template-thumb"></div>
        <div class="gs-template-name">Small business</div>
      </div>
      <div class="gs-template-card">
        <div class="gs-template-thumb"></div>
        <div class="gs-template-name">Newsletter</div>
      </div>
    </div>
  </div>
</div>
