<div class="gs-embed">
  <style>
    .gs-embed {
      --gs-bg: #ffffff;
      --gs-panel: #f8f9fa;
      --gs-border: #dadce0;
      --gs-text: #202124;
      --gs-text-muted: #5f6368;
      --gs-accent: #1a73e8;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 360px;
      margin: 1em 0 1.5em 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
      background: var(--gs-bg);
      color: var(--gs-text);
      font-size: 12.5px;
    }
    .gs-embed-header {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 1px solid var(--gs-border);
    }
    .gs-embed-tabs {
      display: flex;
      border-bottom: 1px solid var(--gs-border);
    }
    .gs-embed-tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 11.5px;
      color: var(--gs-text-muted);
    }
    .gs-embed-tab.active {
      color: var(--gs-accent);
      border-bottom: 2px solid var(--gs-accent);
      font-weight: 500;
    }
    .gs-embed-body {
      padding: 14px;
    }
    .gs-embed-label {
      display: block;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gs-text-muted);
      margin: 0 0 6px 0;
    }
    .gs-embed-code {
      background: var(--gs-panel);
      border: 1px solid var(--gs-border);
      border-radius: 4px;
      padding: 8px 10px;
      font-family: "Roboto Mono", Consolas, monospace;
      font-size: 10.5px;
      color: var(--gs-text-muted);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .gs-embed-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--gs-border);
    }
    .gs-embed-btn {
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--gs-text-muted);
    }
    .gs-embed-btn.primary {
      background: var(--gs-accent);
      color: #fff;
      font-weight: 500;
    }
  </style>

  <div class="gs-embed-header">Embed</div>
  <div class="gs-embed-tabs">
    <div class="gs-embed-tab">Embed URL</div>
    <div class="gs-embed-tab active">Embed code</div>
  </div>
  <div class="gs-embed-body">
    <span class="gs-embed-label">Paste embed code</span>
    <div class="gs-embed-code">&lt;iframe src="https://..." width="600" height="400"&gt;&lt;/iframe&gt;</div>
  </div>
  <div class="gs-embed-footer">
    <span class="gs-embed-btn">Cancel</span>
    <span class="gs-embed-btn primary">Insert</span>
  </div>
</div>
