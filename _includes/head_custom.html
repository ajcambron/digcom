<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", roboto, "Helvetica Neue", arial, sans-serif;
  }
  h1, h2, h3, h4, h5, h6,
  .site-title {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", roboto, "Helvetica Neue", arial, sans-serif;
  }

  .vocab-csv-btn {
    display: inline-block;
    margin: 0 0 1.5em 0;
    padding: 0.4em 0.8em;
    font-size: 0.8em;
    font-family: inherit;
    color: #ffffff;
    background-color: #0a6cff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .vocab-csv-btn:hover {
    background-color: #0857cc;
  }

  .worksheet-card {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0.8em 0 1.5em 0;
    padding: 10px;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    background: #fafafa;
    max-width: 420px;
  }
  .worksheet-preview-link {
    flex-shrink: 0;
    display: block;
    border: 1px solid #ccc;
    border-radius: 3px;
    overflow: hidden;
    line-height: 0;
  }
  .worksheet-preview {
    width: 90px;
    height: auto;
    display: block;
  }
  .worksheet-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .worksheet-title {
    font-size: 0.9em;
    font-weight: 600;
  }
  .worksheet-download-btn {
    display: inline-block;
    width: fit-content;
    padding: 0.35em 0.7em;
    font-size: 0.8em;
    color: #ffffff !important;
    background-color: #0a6cff;
    border: none;
    border-radius: 4px;
    text-decoration: none !important;
  }
  .worksheet-download-btn:hover {
    background-color: #0857cc;
  }

  @media print {
    .side-bar,
    .site-header,
    .breadcrumb-nav,
    .site-footer,
    .search-footer,
    .vocab-csv-btn,
    .worksheet-card,
    .no-print {
      display: none !important;
    }
    .main-content-wrap {
      margin: 0 !important;
    }
    .main-content {
      max-width: 100% !important;
      padding: 0 !important;
    }
    body {
      font-size: 11pt;
    }
    table {
      break-inside: avoid;
    }
  }
</style>
<script src="{{ '/assets/js/vocab-csv.js' | relative_url }}" defer></script>
