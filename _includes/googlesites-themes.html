<div class="gs-themes">
  <style>
    .gs-themes {
      --gs-bg: #ffffff;
      --gs-border: #dadce0;
      --gs-text: #202124;
      --gs-text-muted: #5f6368;
      --gs-accent: #1a73e8;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 200px;
      margin: 1em 0 1.5em 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
      background: var(--gs-bg);
      color: var(--gs-text);
      font-size: 12px;
    }
    .gs-themes-tabs {
      display: flex;
      border-bottom: 1px solid var(--gs-border);
    }
    .gs-themes-tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 11px;
      color: var(--gs-text-muted);
    }
    .gs-themes-tab.active {
      color: var(--gs-accent);
      border-bottom: 2px solid var(--gs-accent);
      font-weight: 500;
    }
    .gs-themes-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gs-theme-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid transparent;
      border-radius: 6px;
    }
    .gs-theme-card.selected {
      border-color: var(--gs-accent);
      background: #e8f0fe;
    }
    .gs-theme-swatch {
      width: 30px;
      height: 22px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .gs-theme-name {
      font-size: 11.5px;
    }
    .gs-theme-custom {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      color: var(--gs-accent);
    }
  </style>

  <div class="gs-themes-tabs">
    <div class="gs-themes-tab">Insert</div>
    <div class="gs-themes-tab">Pages</div>
    <div class="gs-themes-tab active">Themes</div>
  </div>
  <div class="gs-themes-list">
    <div class="gs-theme-card selected">
      <span class="gs-theme-swatch" style="background: linear-gradient(90deg, #1a73e8 50%, #e8f0fe 50%);"></span>
      <span class="gs-theme-name">Meadow</span>
    </div>
    <div class="gs-theme-card">
      <span class="gs-theme-swatch" style="background: linear-gradient(90deg, #34a853 50%, #e6f4ea 50%);"></span>
      <span class="gs-theme-name">Terra</span>
    </div>
    <div class="gs-theme-card">
      <span class="gs-theme-swatch" style="background: linear-gradient(90deg, #202124 50%, #f1f3f4 50%);"></span>
      <span class="gs-theme-name">Slate</span>
    </div>
    <div class="gs-theme-custom">
      <span>&#43;</span><span>Custom</span>
    </div>
  </div>
</div>
