<div class="gs-quickmenu">
  <style>
    .gs-quickmenu {
      --gs-bg: #ffffff;
      --gs-border: #dadce0;
      --gs-text-muted: #5f6368;
      --gs-accent: #1a73e8;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      max-width: 200px;
      margin: 1em 0 1.5em 0;
    }
    .gs-quickmenu-pill {
      display: inline-flex;
      gap: 4px;
      padding: 5px;
      border-radius: 24px;
      background: var(--gs-bg);
      border: 1px solid var(--gs-border);
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
    }
    .gs-quickmenu-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--gs-text-muted);
    }
    .gs-quickmenu-btn.active {
      background: var(--gs-accent);
      color: #fff;
      font-weight: 700;
    }
    .gs-quickmenu-anchor {
      width: 2px;
      height: 14px;
      background: var(--gs-border);
      margin-left: 20px;
    }
    .gs-quickmenu-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gs-border);
      margin-left: 17px;
    }
  </style>

  <div class="gs-quickmenu-pill">
    <span class="gs-quickmenu-btn">&#128247;</span>
    <span class="gs-quickmenu-btn active">T</span>
    <span class="gs-quickmenu-btn">&#8862;</span>
  </div>
  <div class="gs-quickmenu-anchor"></div>
  <div class="gs-quickmenu-dot"></div>
</div>
